[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osin"
version = "0.1.0"
description = "Backend-first, explainable OSINT identity-correlation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13,<4",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "greenlet>=3.1,<4",
    "httpx>=0.28,<1",
    "ImageHash>=4.3,<5",
    "pgvector>=0.3.6,<1",
    "Pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dateutil>=2.9,<3",
    "python-multipart>=0.0.22,<1",
    "sentence-transformers==6.0.1",
    "rapidfuzz>=3.11,<4",
    "SQLAlchemy[asyncio]>=2.0.36,<3",
    "tenacity>=9,<10",
    "tldextract>=5.1,<6",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
live = ["maigret==0.6.5", "sherlock-project==0.16.0", "social-analyzer==0.45", "google-genai>=1.0,<2"]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: actual network integration; requires DEUS_TEST_USERNAME or other operator seed",
    "postgres: requires TEST_DATABASE_URL pointing to PostgreSQL with permission to create an isolated schema",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
